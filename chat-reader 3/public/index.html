<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat Reader · TikTok LIVE</title>
<style>
:root{--bg:#10131c;--panel:#171b28;--line:#262c3f;--tx:#e9ecf5;--mut:#8b93ab;--live:#ff3d6e;--ok:#3de0b0;--acc:#7c8cff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.01em}
form{display:flex;gap:8px;flex:1;min-width:260px}
input[type=text],input[type=number],select,textarea{background:#0d1019;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
button{background:var(--acc);color:#0b0d16;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#st{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:14px}
#dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.connected #dot{background:var(--ok)}.connecting #dot,.reconnecting #dot{background:#f5b942}.error #dot{background:var(--live)}
main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;height:calc(100% - 66px)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:0;padding:11px 14px;border-bottom:1px solid var(--line)}
#chat{flex:1;overflow-y:auto;padding:6px 14px;overscroll-behavior:contain}
.m{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #1d2233}
.m img,.m i{width:34px;height:34px;border-radius:50%;flex:none;background:#2a3047;object-fit:cover}
.u{font-weight:600;color:var(--acc);cursor:pointer;word-break:break-all}.t{word-break:break-word}
.ev{color:var(--mut);font-size:14px}.ev b{color:var(--tx)}
aside{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.box{padding:12px 14px;display:grid;gap:10px}
label{display:grid;gap:4px;color:var(--mut);font-size:13px}
label.c{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}
label.c input{width:auto;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.stats div{background:#0d1019;border-radius:8px;padding:8px 10px;color:var(--mut);font-size:13px}.stats b{display:block;color:var(--tx);font-size:22px}
#q{font-size:13px;color:var(--mut)}
@media(max-width:820px){body{overflow:auto}html,body{height:auto}main{grid-template-columns:1fr;height:auto}#chat{height:55vh;flex:none}aside{overflow:visible}}
</style></head><body>
<header><h1>Chat Reader</h1>
<form id="f"><input type="text" id="tg" placeholder="Pega el link o @usuario" autocomplete="off" autocapitalize="off" aria-label="Link o usuario de TikTok LIVE"><button>Conectar al LIVE</button></form>
<div id="st"><span id="dot"></span><span id="stx">Desconectado</span></div></header>
<main>
<section><h2>COMENTARIOS EN VIVO</h2><div id="chat" aria-live="off"><p class="ev" id="empty">Pega un @usuario que esté en LIVE y pulsa «Conectar al LIVE».</p></div></section>
<aside>
<section><h2>LECTOR DE VOZ</h2><div class="box">
<label class="c"><input type="checkbox" id="on"> 🔊 Leer comentarios</label>
<label class="c"><input type="checkbox" id="ll" checked> 🔊 Modo baja latencia</label>
<label class="c"><input type="checkbox" id="rn" checked> Leer nombre del usuario</label>
<label>Motor de voz<select id="eng"><option value="browser">Voz del navegador</option><option value="server" disabled>Voz del servidor (no disponible en este servidor)</option></select></label>
<label>Idioma<select id="lang"><option value="es">Español</option><option value="en">English</option></select></label>
<label>Voz<div style="display:flex;gap:6px"><select id="voice"></select><button class="ghost" type="button" id="test">🔊 Probar voz</button></div></label>
<label>Velocidad <input type="range" id="rate" min=".6" max="2" step=".1" value="1.1"></label>
<label>Volumen <input type="range" id="vol" min="0" max="1" step=".05" value="1"></label>
<div id="q">En cola: 0</div></div></section>
<section><h2>FILTROS</h2><div class="box">
<label class="c"><input type="checkbox" id="dd" checked> No repetir comentarios idénticos</label>
<label class="c"><input type="checkbox" id="eo" checked> Ignorar solo emojis</label>
<label>Máx. caracteres por comentario<input type="number" id="ml" value="140" min="10" max="500"></label>
<label>Segundos mínimos entre lecturas<input type="number" id="gap" value="1" min="0" max="30" step=".5"></label>
<label>Máximo leídos por minuto<select id="pm"><option>10</option><option>20</option><option>30</option><option value="0" selected>Sin límite</option></select></label>
<label>Palabras bloqueadas (separadas por coma)<textarea id="bw" rows="2"></textarea></label>
<label>Usuarios silenciados (clic en un nombre del chat para añadir)<textarea id="mu" rows="2"></textarea></label></div></section>
<section><h2>EVENTOS LEÍDOS POR VOZ</h2><div class="box">
<label class="c"><input type="checkbox" id="e_gift"> 🎁 Regalos</label>
<label class="c"><input type="checkbox" id="e_follow"> ➕ Nuevos seguidores</label>
<label class="c"><input type="checkbox" id="e_join"> 👤 Usuarios que entran</label>
<label class="c"><input type="checkbox" id="e_like"> ❤️ Likes</label></div></section>
<section><h2>ESTADÍSTICAS</h2><div class="stats">
<div>👥 Usuarios<b id="s_u">0</b></div><div>💬 Comentarios<b id="s_c">0</b></div>
<div>❤️ Likes<b id="s_l">0</b></div><div>🎁 Regalos<b id="s_g">0</b></div></div></section>
</aside></main>
<script src="tts-queue.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={c:0,l:0,g:0,users:new Set()};let target='',ws,retry=0,wantConn=false;
// ---- límites de la cola de voz (fáciles de modificar) ----
const MAX_COMMENT_AGE=10000;            // ms: un comentario más viejo que esto NO se lee
const MAX_QUEUE_SIZE=5;                 // comentarios pendientes máximos (se pierden los más antiguos)
const LOW_LATENCY_MAX_COMMENT_AGE=8000; // idem en «Modo baja latencia»
const LOW_LATENCY_MAX_QUEUE_SIZE=3;
const DEBUG_TTS=true;                   // logs [TTS] / [PAGE] / [WS] en la consola
const dbg=(...a)=>{if(DEBUG_TTS)console.log(...a)};
// ---- ajustes persistentes ----
const ids=['rn','lang','rate','vol','dd','eo','ml','gap','pm','bw','mu','e_gift','e_follow','e_join','e_like','voice','ll','eng'];
try{const s=JSON.parse(localStorage.cs||'{}');ids.forEach(i=>{if(i in s)s[i]===true||s[i]===false?$(i).checked=s[i]:$(i).value=s[i]})}catch{}
const save=()=>{try{localStorage.cs=JSON.stringify(Object.fromEntries(ids.map(i=>[i,$(i).type==='checkbox'?$(i).checked:$(i).value])))}catch{}};
document.querySelectorAll('aside input,aside select,aside textarea').forEach(e=>e.addEventListener('change',save));
// ---- voz ----
const synth=window.speechSynthesis;let voices=[],wanted='';
try{wanted=JSON.parse(localStorage.cs).voice||''}catch{}
const stamps=[],recent=[];
let last=0,busy=false,gen=0,deadline=0,curDone=null,curSrc=null,cur=null,enabledAt=Infinity,readyAt=Infinity,lastLag=null;
const attr=s=>String(s).replace(/"/g,'&quot;');
const norm=l=>l.replace('_','-').toLowerCase();
// Mónica/Paulina primero, luego es-ES / es-MX / es-US, luego cualquier otra voz del idioma
const pref=v=>(/m[oó]nica|paulina/i.test(v.name)?0:2)+(['es-es','es-mx','es-us'].includes(norm(v.lang))?0:1);
function loadVoices(){const p=$('lang').value;voices=(synth?synth.getVoices():[]).filter(v=>norm(v.lang).startsWith(p));
 if(p==='es')voices.sort((a,b)=>pref(a)-pref(b));
 const keep=$('voice').value||wanted;
 $('voice').innerHTML=voices.map(v=>`<option value="${attr(v.name)}">${attr(v.name)} (${v.lang})</option>`).join('')||'<option value="">Predeterminada del dispositivo</option>';
 if(voices.some(v=>v.name===keep))$('voice').value=keep}
if(synth){synth.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,500);setTimeout(loadVoices,1500)}
$('lang').addEventListener('change',loadVoices);
const list=id=>$(id).value.split(',').map(s=>s.trim().toLowerCase().replace(/^@/,'')).filter(Boolean);
const stripEmoji=t=>t.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\u200d\ufe0f]/gu,'').trim();
// Cola con control de antigüedad (public/tts-queue.js)
const limits=()=>$('ll').checked?{maxAge:LOW_LATENCY_MAX_COMMENT_AGE,maxQueue:LOW_LATENCY_MAX_QUEUE_SIZE}:{maxAge:MAX_COMMENT_AGE,maxQueue:MAX_QUEUE_SIZE};
const qlabel=()=>$('q').textContent='En cola: '+queue.length+(lastLag!=null?' · último retraso: '+(lastLag/1000).toFixed(1)+' s':'');
const queue=TtsQueue.create({getLimits:limits,log:dbg,onDrop:()=>qlabel()});
$('ll').addEventListener('change',()=>{queue.prune();qlabel();dbg('[TTS] Modo baja latencia:',$('ll').checked?'ON':'OFF')});
// ---- audio generado por el servidor (opcional): el navegador lo reproduce con Web Audio ----
let AC=null,serverTts=false,ttsSeq=1,ka=null,lastResume=0;const ttsWait=new Map();
function unlockAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();AC.onstatechange=()=>dbg('[AUDIO] AudioContext:',AC.state)}
 if(AC.state!=='running')AC.resume().catch(()=>{})}catch(e){dbg('[AUDIO] no disponible',e)}}
// Tono inaudible continuo: un contexto de audio activo evita que el navegador suspenda/ralentice la pestaña en segundo plano.
function startKeepAlive(){unlockAudio();if(!AC||ka)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=40;g.gain.value=0.0002;o.connect(g);g.connect(AC.destination);o.start();ka={o};dbg('[AUDIO] keep-alive activo')}catch{}}
function stopKeepAlive(){try{ka&&ka.o.stop()}catch{}ka=null}
const useServer=()=>$('eng').value==='server'&&serverTts&&AC&&ws&&ws.readyState===1;
function engUi(){const o=[...$('eng').options].find(o=>o.value==='server');if(!o)return;o.disabled=!serverTts;
 o.textContent=serverTts?'Voz del servidor (estable en 2.º plano, voz robótica)':'Voz del servidor (no disponible en este servidor)';
 if(!serverTts&&$('eng').value==='server')$('eng').value='browser'}
function fetchAudio(text){const p=new Promise((res,rej)=>{const id=ttsSeq++;
 const t=setTimeout(()=>{ttsWait.delete(id);rej(new Error('timeout'))},6000);ttsWait.set(id,{res,rej,t});
 ws.send(JSON.stringify({type:'tts',id,text,lang:$('lang').value,rate:+$('rate').value}))});p.catch(()=>{});return p}
function onAudio(buf){if(!AC||buf.byteLength<8)return;const id=new DataView(buf).getUint32(0),w=ttsWait.get(id);if(!w)return;
 clearTimeout(w.t);ttsWait.delete(id);
 new Promise((res,rej)=>AC.decodeAudioData(buf.slice(4),res,rej)).then(w.res,w.rej)}
function stopAll(){gen++;try{synth&&synth.cancel()}catch{}try{curSrc&&curSrc.stop()}catch{}curSrc=null;curDone=null;busy=false}
function sayBrowser(it,done){if(!synth)return done();
 try{if(synth.paused)synth.resume()}catch{}
 const u=new SpeechSynthesisUtterance(it.text);const v=voices.find(v=>v.name===$('voice').value);
 if(v){u.voice=v;u.lang=v.lang}else u.lang=$('lang').value==='es'?'es-ES':'en-US';
 u.rate=+$('rate').value;u.volume=+$('vol').value;
 cur=u; // referencia global: evita que el navegador descarte la voz antes de terminar (no dispararía onend)
 u.onend=()=>done();u.onerror=()=>done();dbg('[TTS SPEAKING]',it.text);synth.speak(u)}
function playBuffer(buf,done){try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;g.gain.value=+$('vol').value;s.connect(g);g.connect(AC.destination);
 s.onended=()=>done();curSrc=s;if(AC.state!=='running')AC.resume().catch(()=>{});dbg('[TTS SPEAKING] (servidor)');s.start()}catch{done()}}
function speakItem(it){busy=true;const g=++gen;let fin=false;
 const done=(noGap)=>{if(fin||g!==gen)return;fin=true;curDone=null;curSrc=null;busy=false;if(noGap!==true)last=Date.now();dbg('[TTS FINISHED]',it.text);
  pump()}; // al terminar, revisa AL INSTANTE la antigüedad de lo pendiente (sin esperar a ningún timer)
 curDone=done;deadline=Date.now()+Math.max(8000,it.text.length*250)+(it.audio?8000:0);
 if(it.audio)it.audio.then(buf=>{if(fin)return;if(!queue.isFresh(it))return done(true);playBuffer(buf,done)})
  .catch(()=>{if(fin)return;if(!queue.isFresh(it))return done(true);dbg('[TTS] Falló la voz del servidor, uso la del navegador');sayBrowser(it,done)});
 else sayBrowser(it,done)}
function speakNow(text){stopAll();try{synth&&synth.resume()}catch{}
 const it={text,receivedAt:Date.now()};if(useServer())it.audio=fetchAudio(text);else if(!synth)return alert('Este navegador no soporta voz.');speakItem(it)}
// Reproduce el siguiente comentario si procede. Se llama (1) al llegar un comentario, (2) al terminar una frase y (3) desde el latido del worker.
function pump(){if(!$('on').checked)return;queue.prune();qlabel();if(busy||!queue.length)return;
 const now=Date.now();if(now-last<$('gap').value*1000)return;
 const pm=+$('pm').value;while(stamps.length&&now-stamps[0]>6e4)stamps.shift();if(pm&&stamps.length>=pm)return;
 const it=queue.next();if(!it){qlabel();return}
 lastLag=now-it.receivedAt;stamps.push(now);qlabel();speakItem(it)}
function enqueue(text,at,id){const n=Date.now();
 // solo comentarios NUEVOS: posteriores a activar el lector y al periodo de gracia tras conectar
 if(!$('on').checked||n<enabledAt||n<readyAt||!text)return;
 const it={id:id||'',text,receivedAt:at||n};
 if(!queue.push(it))return; // id repetido: ya se recibió/leyó
 dbg('[TTS QUEUED]',text);if(useServer())it.audio=fetchAudio(text);qlabel();pump()}
$('on').addEventListener('change',()=>{
 if($('on').checked){enabledAt=Date.now();queue.clear();unlockAudio();startKeepAlive();speakNow('Lector de comentarios activado')} // el clic desbloquea el audio en Safari
 else{enabledAt=Infinity;queue.clear();stopAll();stopKeepAlive()}
 qlabel()});
$('test').onclick=()=>{unlockAudio();speakNow('Hola, el lector de comentarios está funcionando correctamente.')};
// ---- visibilidad de la página ----
let hiddenAt=0;
function onVis(){const v=document.visibilityState;
 if(v==='visible'){dbg('[PAGE] visible'+(hiddenAt?` (estuvo oculta ${((Date.now()-hiddenAt)/1000).toFixed(0)}s)`:''));hiddenAt=0;
  try{synth&&synth.paused&&synth.resume()}catch{}if(AC&&AC.state!=='running')AC.resume().catch(()=>{});pump()}
 else{dbg('[PAGE] hidden');hiddenAt=Date.now()}}
document.addEventListener('visibilitychange',onVis);dbg('[PAGE]',document.visibilityState);
window.addEventListener('online',()=>{dbg('[WS] red recuperada');reconnectAt=0});
// ---- latido: un Worker no sufre el throttling de los timers de la página en segundo plano ----
// (la lógica principal es por eventos: llegada de comentario y fin de frase; el latido solo cubre gaps, watchdog y WebSocket)
function tick(){const now=Date.now();
 if(busy&&now>deadline){dbg('[TTS] Watchdog: la voz no terminó, se libera');try{synth&&synth.cancel()}catch{}try{curSrc&&curSrc.stop()}catch{}curDone&&curDone()}
 if(AC&&$('on').checked&&AC.state!=='running'&&now-lastResume>3000){lastResume=now;AC.resume().catch(()=>{})}
 wsTick(now);pump()}
try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),250)'],{type:'text/javascript'})));w.onmessage=tick;dbg('[PAGE] latido por Worker activo')}catch{dbg('[PAGE] sin Worker, latido por setInterval')}
setInterval(tick,500); // respaldo si el Worker no está disponible
// ---- UI ----
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function add(html){const c=$('chat');$('empty')?.remove();const near=c.scrollHeight-c.scrollTop-c.clientHeight<80;
 c.insertAdjacentHTML('beforeend',html);while(c.children.length>3000)c.firstChild.remove();if(near)c.scrollTop=c.scrollHeight}
function readChat(e){const t=stripEmoji(e.text||'');const raw=(e.text||'').trim();
 if(!t&&$('eo').checked)return;if(raw.length>+$('ml').value)return;
 if(list('mu').includes(e.user.toLowerCase()))return;
 if(list('bw').some(w=>raw.toLowerCase().includes(w)))return;
 if($('dd').checked){const k=raw.toLowerCase();if(recent.includes(k))return;recent.push(k);if(recent.length>60)recent.shift()}
 const en=$('lang').value==='en';enqueue($('rn').checked?`${e.user} ${en?'says':'dice'}: ${t||raw}`:(t||raw),e.at,e.id)}
function readEvent(e){if(!$('e_'+e.kind)?.checked||list('mu').includes(e.user.toLowerCase()))return;const en=$('lang').value==='en';
 const m={gift:en?`${e.user} sent ${e.text}`:`${e.user} envió ${e.text}`,follow:en?`${e.user} followed`:`${e.user} te sigue`,join:en?`${e.user} joined`:`${e.user} entró al LIVE`,like:en?`${e.user} liked`:`${e.user} dio like`};enqueue(m[e.kind],e.at)}
function onEvent(e){S.users.add(e.user);$('s_u').textContent=S.users.size;
 if(e.kind==='chat'){S.c++;$('s_c').textContent=S.c;
  add(`<div class="m">${e.avatar?`<img src="${esc(e.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createElement('i'))">`:'<i></i>'}<div><span class="u" data-u="${esc(e.user)}">@${esc(e.user)}</span><div class="t">${esc(e.text)}</div></div></div>`);readChat(e)}
 else{if(e.kind==='like'){S.l+=e.count||1;$('s_l').textContent=S.l;return}
  if(e.kind==='gift'){S.g+=e.count||1;$('s_g').textContent=S.g}
  const ic={gift:'🎁',follow:'➕',join:'👤'}[e.kind];if(e.kind==='join')return readEvent(e);
  add(`<div class="m ev"><span>${ic}</span><span><b>@${esc(e.user)}</b> ${e.kind==='gift'?`envió ${esc(e.text)} ×${e.count}`:'empezó a seguirte'}</span></div>`);readEvent(e)}}
$('chat').addEventListener('click',e=>{const u=e.target.dataset?.u;if(u){$('mu').value=($('mu').value?$('mu').value+', ':'')+u;save()}});
function status(s,m){document.body.className=s;if(s==='connected')readyAt=Date.now()+3000;else if(s!=='reconnecting')readyAt=Infinity;$('stx').textContent={connected:'🟢 Conectado',connecting:'Conectando…',reconnecting:'🟡 Reconectando…',error:'🔴 Error',offline:'Desconectado'}[s]+(m?' · '+m:'')}
// ---- WebSocket con reconexión (gobernada por el latido, no por setTimeout) ----
let lastRx=0,lastPing=0,reconnectAt=0,clockOff=Infinity;
// Antigüedad real: usa la hora a la que el SERVIDOR recibió el evento (corrige la hora del reloj con el mínimo retraso observado),
// de modo que un mensaje que el navegador retuvo en segundo plano no parezca «nuevo» al llegar.
function stamp(sa){const rx=Date.now();if(!sa)return rx;clockOff=Math.min(clockOff,rx-sa);return Math.min(rx,sa+clockOff)}
function wsTick(now){if(!wantConn)return;
 if(ws&&ws.readyState===1){
  if(now-lastPing>20000){lastPing=now;ws.send(JSON.stringify({type:'ping',t:now}))} // tráfico ENTRANTE para Render: evita que se duerma
  if(now-lastRx>60000){dbg('[WS] sin respuesta del servidor, reconectando');try{ws.onclose=null;ws.close()}catch{}ws=null;status('reconnecting','sin respuesta del servidor');open()}}
 else if((!ws||ws.readyState>1)&&now>=reconnectAt)open()}
function open(){const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');w.binaryType='arraybuffer';
 w.onopen=()=>{retry=0;lastRx=lastPing=Date.now();dbg('[WS] conectado');if(wantConn)w.send(JSON.stringify({type:'connect',platform:'tiktok',target}))};
 w.onmessage=m=>{lastRx=Date.now();
  if(typeof m.data!=='string')return onAudio(m.data);
  let d;try{d=JSON.parse(m.data)}catch{return}
  if(d.type==='pong')return;
  if(d.type==='hello'){serverTts=!!d.tts;engUi();return}
  if(d.type==='tts_error'){const x=ttsWait.get(d.id);if(x){clearTimeout(x.t);ttsWait.delete(d.id);x.rej(new Error('tts'))}return}
  if(d.type==='status')status(d.state,d.msg);
  else if(d.type==='chat'){if(!d.comment||!d.comment.trim())return;
   onEvent({kind:'chat',user:d.username,nick:d.nickname,text:d.comment,avatar:d.profilePicture,id:d.id,at:stamp(d.serverAt)})}
  else if(d.event)onEvent({...d.event,at:stamp(d.serverAt)})};
 w.onclose=()=>{if(w!==ws)return;dbg('[WS] cerrado');if(wantConn){status('reconnecting','sin conexión con el servidor');reconnectAt=Date.now()+Math.min(10000,1000*2**retry++)}}}
$('f').onsubmit=e=>{e.preventDefault();target=$('tg').value.trim();if(!target)return;wantConn=true;readyAt=Infinity;
 // nuevo LIVE: se vacía por completo lo pendiente del anterior
